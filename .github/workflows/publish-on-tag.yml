# snippet to include in your workflow (publish job)
- name: Setup Node.js (and NPM registry)
  uses: actions/setup-node@v4
  with:
    node-version: '20'
    cache: 'npm'
    registry-url: 'https://registry.npmjs.org'
    always-auth: true   # ensures auth is used for publish

- name: Publish to npm
  env:
    NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  run: |
    # optional safety: ensure tag/version alignment
    TAG=${GITHUB_REF#refs/tags/}
    PKG_VERSION=$(node -p "require('./package.json').version")
    if [ "$TAG" != "v$PKG_VERSION" ]; then
      echo "::error ::Tag ($TAG) does not match package.json (v$PKG_VERSION). Aborting."
      exit 1
    fi

    # publish
    npm publish --access public
